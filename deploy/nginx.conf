##############################################################
# Nginx config for pos.vyrosocial.com
# Place this at: /etc/nginx/sites-available/vyro-pos
# Then: sudo ln -s /etc/nginx/sites-available/vyro-pos /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx
##############################################################

server {
    listen 80;
    listen [::]:80;
    server_name pos.vyrosocial.com;

    # Redirect HTTP → HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.vyrosocial.com;

    # ── SSL (Let's Encrypt via certbot) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/pos.vyrosocial.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.vyrosocial.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"             always;
    add_header X-XSS-Protection      "1; mode=block"          always;
    add_header X-Content-Type-Options "nosniff"               always;
    add_header Referrer-Policy       "no-referrer-when-downgrade" always;

    # ── Frontend (React SPA) ─────────────────────────────────────
    root  /var/www/vyro-pos/dist;
    index index.html;

    # ── Gzip ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;

    # ── Backend health check ─────────────────────────────────────
    location = /health {
        proxy_pass         http://127.0.0.1:3001/health;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── M-Pesa API routes ────────────────────────────────────────
    location /api/mpesa {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        'upgrade';
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Allow M-Pesa callbacks (larger body)
        client_max_body_size 1M;
        proxy_read_timeout   60s;
    }

    # ── React Router (SPA fallback) ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static assets caching ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Logs ─────────────────────────────────────────────────────
    access_log /var/log/nginx/vyro-pos.access.log;
    error_log  /var/log/nginx/vyro-pos.error.log;
}
